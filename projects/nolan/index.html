<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onde ficam os políticos brasileiros · Diagrama de Nolan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --paper: #f5f1ea;
    --ink: #1d1b19;
    --muted: #7a736a;
    --hair: rgba(29, 27, 25, 0.09);
    --lib: #c8962e;
    --esq: #b4483c;
    --dir: #2f5d8a;
    --est: #6b5b7b;
    --cen: #8a8378;
    --mais-lib: #2f5d8a;
    --mais-est: #b4532a;
    --parte: #cdbf9f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    min-height: 100vh;
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 28px 32px 20px;
  }
  header h1 {
    margin: 0;
    font: 400 clamp(26px, 3.2vw, 40px)/1.08 Fraunces, Georgia, serif;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 8px 0 0;
    max-width: 560px;
    color: var(--muted);
  }
  .chart {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  svg { width: 100%; height: auto; max-height: calc(100vh - 150px); display: block; overflow: visible; }

  .region { stroke: var(--paper); stroke-width: 2; transition: opacity .25s; }
  .grid line { stroke: var(--hair); }
  .region-label {
    font: italic 400 48px Fraunces, Georgia, serif;
    fill: var(--ink);
    opacity: .3;
    text-anchor: middle;
    pointer-events: none;
  }
  .axis text, text.axis { font: 600 17px Inter, sans-serif; fill: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .axis .tick, text.tick { font: 500 16px Inter, sans-serif; letter-spacing: 0; text-transform: none; }

  .leader { stroke: var(--ink); stroke-opacity: .3; stroke-width: 1.5; }
  .point { cursor: pointer; }
  .point circle { fill: var(--ink); stroke: var(--paper); stroke-width: 3; transition: r .2s; }
  .label {
    font: 500 21px Inter, sans-serif;
    fill: var(--ink);
    paint-order: stroke;
    stroke: var(--paper);
    stroke-width: 7px;
    stroke-linejoin: round;
    cursor: pointer;
    transition: opacity .2s;
  }
  .dim .point:not(.on) { opacity: .18; }
  .dim .label:not(.on), .dim .leader:not(.on) { opacity: .15; }
  .point.parcial circle { fill: var(--paper); stroke: var(--ink); stroke-width: 3.5; }
  .point.on circle { r: 14; }
  .label.on { font-weight: 600; }

  .search {
    position: absolute;
    right: 32px;
    top: 34px;
  }
  .search input {
    width: 210px;
    padding: 9px 14px;
    border: 1px solid var(--hair);
    border-radius: 99px;
    background: rgba(255,255,255,.6);
    font: 14px Inter, sans-serif;
    color: var(--ink);
    outline: none;
  }
  .search input:focus { border-color: var(--ink); background: #fff; }

  aside {
    border-left: 1px solid var(--hair);
    padding: 34px 28px;
    background: rgba(255,255,255,.35);
    overflow-y: auto;
    max-height: 100vh;
    position: sticky;
    top: 0;
  }
  .kicker { font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  aside h2 { margin: 6px 0 2px; font: 400 28px/1.1 Fraunces, Georgia, serif; }
  .role { color: var(--muted); font-size: 13px; }
  .scores { display: grid; gap: 12px; margin: 22px 0 26px; }
  .score-row { display: grid; grid-template-columns: 92px 1fr 30px; align-items: center; gap: 10px; font-size: 13px; }
  .bar { position: relative; height: 6px; border-radius: 99px; background: var(--hair); }
  .bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--ink); }
  .score-row b { text-align: right; font-weight: 600; }
  .score-row small { grid-column: 2 / -1; margin-top: -6px; color: var(--muted); font-size: 11px; }
  .items h3 { margin: 18px 0 8px; font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .item { display: grid; grid-template-columns: 12px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--hair); font-size: 13px; line-height: 1.4; }
  .item i { width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; }
  .item small { display: block; color: var(--muted); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; background: var(--c); vertical-align: -1px; }
  .legend span.vazado::before { background: transparent; border: 2px solid var(--ink); width: 6px; height: 6px; }
  .intro p { color: var(--muted); }
  .foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
  .foot a { color: var(--ink); }

  @media (max-width: 960px) {
    .page { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-left: 0; border-top: 1px solid var(--hair); }
    .search { position: static; margin-top: 14px; }
    svg { max-height: none; }
  }
</style>
</head>
<body>
<div class="page">
  <main class="stage">
    <header>
      <h1>Onde ficam os políticos brasileiros</h1>
      <p>Quanta liberdade cada um defende na economia e na vida pessoal, medida pelo que votou, fez no governo ou disse em público.</p>
    </header>
    <div class="search"><input id="q" type="search" placeholder="Buscar político" autocomplete="off"></div>
    <div class="chart"><svg id="chart" viewBox="-60 -40 1120 1080" role="img" aria-label="Diagrama de Nolan"></svg></div>
  </main>
  <aside id="panel"></aside>
</div>

<script>
const DATA_URL = "../brviz/src/data/nolan.json";
const METODO_URL = "../brviz/nolan";
const PONTOS = {concordo: 100, em_parte: 50, discordo: 0};
const RESPOSTA = {concordo: "concorda", em_parte: "em parte", discordo: "discorda", sem_registro: "sem registro"};

const MIN_ITENS = 6;
const REGIOES = [
  {nome: "Libertário", cor: "var(--lib)", pts: [[50, 50], [100, 50], [100, 100], [50, 100]], rotulo: [84, 84]},
  {nome: "Esquerda", cor: "var(--esq)", pts: [[0, 50], [50, 50], [50, 100], [0, 100]], rotulo: [16, 84]},
  {nome: "Direita", cor: "var(--dir)", pts: [[50, 0], [100, 0], [100, 50], [50, 50]], rotulo: [84, 16]},
  {nome: "Estatista", cor: "var(--est)", pts: [[0, 0], [50, 0], [50, 50], [0, 50]], rotulo: [16, 16]},
  {nome: "Centro", cor: "var(--cen)", pts: [[30, 30], [70, 30], [70, 70], [30, 70]], rotulo: [50, 50]}
];

const C = 500, R = 470;
const proj = (e, p) => [C + ((e - p) / 100) * R, C + R - ((e + p) / 100) * R];
let ITENS = [];

const svg = d3.select("#chart");
const panel = d3.select("#panel");

d3.json(DATA_URL).then((data) => {
  ITENS = data.itens;
  const itens = new Map(data.itens.map((d) => [d.id, d]));
  const figuras = data.figuras.map((f) => {
    const rs = f.respostas.map((r) => {
      const it = itens.get(r.item);
      const v = PONTOS[r.resposta];
      return {...r, eixo: it.eixo, texto: it.texto, nota: v === undefined ? null : it.sentido === "liberdade" ? v : 100 - v};
    });
    const comNota = (eixo) => rs.filter((r) => r.eixo === eixo && r.nota !== null);
    const e = d3.mean(comNota("economico"), (r) => r.nota), p = d3.mean(comNota("pessoal"), (r) => r.nota);
    const nE = comNota("economico").length, nP = comNota("pessoal").length;
    const [x, y] = proj(e, p);
    return {...f, rs, e, p, nE, nP, parcial: Math.min(nE, nP) < MIN_ITENS, x, y};
  });

  desenharFundo();
  desenharPontos(figuras);
  painelInicial(figuras.length);

  d3.select("#q").on("input", function () {
    const q = this.value.trim().toLowerCase();
    if (!q) return destacar(null, false, true);
    const hit = figuras.find((f) => f.nome.toLowerCase().includes(q) || f.curto.toLowerCase().includes(q));
    destacar(hit || null, false, true);
  });
});

function desenharFundo() {
  const poly = (pts) => pts.map(([e, p]) => proj(e, p).join(",")).join(" ");
  const regioes = REGIOES;

  const g = svg.append("g");
  const regiao = (d, opacidade) => g.append("polygon")
    .attr("class", "region")
    .attr("points", poly(d.pts))
    .attr("fill", d.cor)
    .attr("fill-opacity", opacidade);
  regioes.slice(0, 4).forEach((d) => regiao(d, 0.15));
  g.append("polygon").attr("points", poly(regioes[4].pts)).attr("fill", "var(--paper)");
  regiao(regioes[4], 0.14);

  const grid = svg.append("g").attr("class", "grid");
  for (let v = 10; v < 100; v += 10) {
    grid.append("line").attr("x1", proj(v, 0)[0]).attr("y1", proj(v, 0)[1]).attr("x2", proj(v, 100)[0]).attr("y2", proj(v, 100)[1]);
    grid.append("line").attr("x1", proj(0, v)[0]).attr("y1", proj(0, v)[1]).attr("x2", proj(100, v)[0]).attr("y2", proj(100, v)[1]);
  }

  svg.append("polygon")
    .attr("points", poly([[0, 0], [100, 0], [100, 100], [0, 100]]))
    .attr("fill", "none").attr("stroke", "var(--ink)").attr("stroke-opacity", 0.35);

  svg.append("g").selectAll("text").data(regioes).join("text")
    .attr("class", "region-label")
    .attr("x", (d) => proj(...d.rotulo)[0])
    .attr("y", (d) => proj(...d.rotulo)[1] + 16)
    .text((d) => d.nome);

  const eixo = (de, ate, rotulo) => {
    const [x1, y1] = proj(...de), [x2, y2] = proj(...ate);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const len = Math.hypot(mx - C, my - C);
    const nx = (mx - C) / len, ny = (my - C) / len;
    let ang = (Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI;
    if (ang > 90 || ang < -90) ang += 180;
    const a = svg.append("g").attr("class", "axis");
    a.append("text")
      .attr("transform", `translate(${mx + nx * 58},${my + ny * 58}) rotate(${ang})`)
      .attr("text-anchor", "middle").attr("dominant-baseline", "middle").text(rotulo);
    [50, 100].forEach((t) => {
      const tx = x1 + ((x2 - x1) * t) / 100, ty = y1 + ((y2 - y1) * t) / 100;
      a.append("text").attr("class", "tick")
        .attr("x", tx + nx * 26).attr("y", ty + ny * 26)
        .attr("text-anchor", "middle").attr("dominant-baseline", "middle").text(t);
    });
  };
  eixo([0, 0], [100, 0], "Liberdade econômica →");
  eixo([0, 0], [0, 100], "← Liberdade pessoal");
  const [bx, by] = proj(0, 0);
  svg.append("text").attr("class", "axis tick").attr("x", bx).attr("y", by + 30).attr("text-anchor", "middle").text("0");
}

function desenharPontos(figuras) {
  const DY = 28;
  const largura = (s) => s.length * 11.8 + 12;
  const H = 28;
  const ocupados = [
    ...figuras.map((f) => ({x: f.x, y: f.y, w: 26, h: 26})),
    ...REGIOES.map((d) => {
      const [x, y] = proj(...d.rotulo);
      return {x, y: y + 2, w: d.nome.length * 23, h: 42};
    })
  ];
  const colide = (r) => ocupados.some((o) => Math.abs(r.x - o.x) * 2 < r.w + o.w && Math.abs(r.y - o.y) * 2 < r.h + o.h);
  const dentro = (r) => [-1, 1].every((sx) => [-1, 1].every((sy) =>
    Math.abs(r.x + sx * r.w / 2 - C) + Math.abs(r.y + sy * r.h / 2 - C) <= R));
  const direcoes = [[0, -1], [0, 1], [1, -0.6], [-1, -0.6], [1, 0.6], [-1, 0.6], [1, 0], [-1, 0]];

  const folga = (f) => R - Math.abs(f.x - C) - Math.abs(f.y - C);
  const nos = [...figuras].sort((a, b) => folga(a) - folga(b) || a.y - b.y).map((f) => {
    const w = largura(f.curto);
    let escolhido = null;
    for (const exigeDentro of [true, false]) {
      for (let dist = 0; dist < 12 && !escolhido; dist++) {
        for (const [ux, uy] of direcoes) {
          const r = {
            x: f.x + ux * ((w / 2 + 16) * Math.abs(ux) + dist * 18),
            y: f.y + uy * (DY + dist * 18 * Math.abs(uy)),
            w, h: H
          };
          if (!colide(r) && (!exigeDentro || dentro(r))) { escolhido = r; break; }
        }
      }
      if (escolhido) break;
    }
    escolhido ??= {x: f.x, y: f.y - DY, w, h: H};
    ocupados.push(escolhido);
    return {f, ...escolhido};
  });

  const camada = svg.append("g").attr("id", "pontos");
  const borda = (d) => [
    Math.max(d.x - d.w / 2, Math.min(d.f.x, d.x + d.w / 2)),
    Math.max(d.y - d.h / 2 + 4, Math.min(d.f.y, d.y + d.h / 2 - 4))
  ];
  camada.selectAll(".leader").data(nos.filter((d) => Math.hypot(...borda(d).map((v, i) => v - [d.f.x, d.f.y][i])) > 24)).join("line")
    .attr("class", "leader")
    .attr("x1", (d) => d.f.x).attr("y1", (d) => d.f.y)
    .attr("x2", (d) => borda(d)[0]).attr("y2", (d) => borda(d)[1]);

  camada.selectAll(".point").data(figuras).join("g")
    .attr("class", (d) => (d.parcial ? "point parcial" : "point"))
    .attr("transform", (d) => `translate(${d.x},${d.y})`)
    .on("mouseenter", (_, d) => destacar(d, true))
    .on("click", (ev, d) => { ev.stopPropagation(); destacar(d, true, true); })
    .append("circle").attr("r", 10);

  camada.selectAll(".label").data(nos).join("text")
    .attr("class", "label")
    .attr("x", (d) => d.x).attr("y", (d) => d.y + 7)
    .attr("text-anchor", "middle")
    .text((d) => d.f.curto)
    .on("mouseenter", (_, d) => destacar(d.f, true))
    .on("click", (ev, d) => { ev.stopPropagation(); destacar(d.f, true, true); });

  camada.selectAll(".point, .label").on("mouseleave", () => destacar(null));
  svg.on("click", () => destacar(null, false, true));
}

let fixado = null;
function destacar(f, _mostrar, fixar) {
  const camada = d3.select("#pontos");
  if (fixar) {
    fixado = f;
    if (f) painelFigura(f); else painelInicial(camada.selectAll(".point").size());
  }
  const alvo = f || fixado;
  svg.classed("dim", !!alvo);
  camada.selectAll(".point").classed("on", (d) => d === alvo);
  camada.selectAll(".label").classed("on", (d) => d.f === alvo);
  camada.selectAll(".leader").classed("on", (d) => d.f === alvo);
}

function regiao(e, p) {
  if (e >= 30 && e <= 70 && p >= 30 && p <= 70) return "Centro";
  if (e >= 50) return p >= 50 ? "Libertário" : "Direita";
  return p >= 50 ? "Esquerda" : "Estatista";
}

function painelInicial(n) {
  const bloco = (eixo, titulo) => `
    <h3>${titulo}</h3>
    ${ITENS.filter((d) => d.eixo === eixo).map((d) => `
      <div class="item">
        <i style="background:${d.sentido === "liberdade" ? "var(--mais-lib)" : "var(--mais-est)"}"></i>
        <div>${d.texto}<small>concordar = ${d.sentido === "liberdade" ? "mais liberdade" : "mais Estado"}</small></div>
      </div>`).join("")}`;
  panel.html(`
    <div class="intro">
      <div class="kicker">Diagrama de Nolan</div>
      <h2>Dois eixos em vez de um</h2>
      <p>Em vez de uma linha entre esquerda e direita, cada político ganha duas notas de 0 a 100: liberdade econômica e liberdade pessoal.</p>
      <p>No topo fica quem quer menos Estado nas duas; embaixo, quem quer mais Estado nas duas. À esquerda, liberdade pessoal com mais Estado na economia; à direita, o contrário.</p>
      <p>Clique num ponto para ver as notas e como o político respondeu a cada afirmação abaixo.</p>
      <div class="legend">
        <span class="vazado">ponto vazado: menos de ${MIN_ITENS} das 8 afirmações de algum eixo com registro</span>
      </div>
      <div class="items">${bloco("economico", "As 8 afirmações sobre economia")}${bloco("pessoal", "As 8 afirmações sobre vida pessoal")}</div>
      <p class="foot">${n} políticos até agora. Cada resposta tem fonte: <a href="${METODO_URL}">método e fichas completas</a>.</p>
    </div>`);
}

function painelFigura(f) {
  const cor = (r) => (r.nota === null ? "transparent" : r.nota === 100 ? "var(--mais-lib)" : r.nota === 0 ? "var(--mais-est)" : "var(--parte)");
  const bloco = (eixo, titulo) => `
    <h3>${titulo}</h3>
    ${f.rs.filter((r) => r.eixo === eixo).map((r) => `
      <div class="item">
        <i style="background:${cor(r)};${r.nota === null ? "border:1px dashed var(--muted)" : ""}"></i>
        <div>${r.texto}<small>${RESPOSTA[r.resposta]}${r.data ? ` · ${r.data.slice(0, 4)}` : ""}${r.confianca === "baixa" ? " · evidência fraca" : ""}</small></div>
      </div>`).join("")}`;
  const barra = (nome, v, n) => `
    <div class="score-row"><span>${nome}</span><div class="bar"><span style="width:${v}%"></span></div><b>${Math.round(v)}</b><small>${n} de 8 afirmações com registro</small></div>`;
  panel.html(`
    <div class="kicker">${regiao(f.e, f.p)}</div>
    <h2>${f.nome}</h2>
    <div class="role">${f.papel}</div>
    <div class="scores">${barra("Econômica", f.e, f.nE)}${barra("Pessoal", f.p, f.nP)}</div>
    <div class="legend" style="margin:-8px 0 6px">
      <span style="--c: var(--mais-lib)">resposta a favor de mais liberdade</span>
      <span style="--c: var(--parte)">em parte</span>
      <span style="--c: var(--mais-est)">a favor de mais Estado</span>
    </div>
    <div class="items">${bloco("economico", "Economia")}${bloco("pessoal", "Vida pessoal")}</div>
    <p class="foot"><a href="${METODO_URL}">Fontes de cada resposta →</a></p>`);
}
</script>
</body>
</html>
